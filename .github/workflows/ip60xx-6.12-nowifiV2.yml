name: IPQ60XX-6.12-NOWIFIV2

on:
  workflow_dispatch:
    inputs:
      track_latest:
        description: '跟踪 Xray/sing-box 上游最新版本（默认关闭，使用 Passwall 已验证版本）'
        type: boolean
        default: false
  schedule:
    - cron: 0 19 * * *  # 每天北京时间 03:00 自动编译

# 并发策略：有新任务触发时自动取消进行中的旧任务，节约 Action 分钟数
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限原则：仅授予 Release 写入权限
permissions:
  contents: write

env:
  # ==================== 核心配置 ====================
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss          # 含 NSS 支持的 6.12 内核分支
  CONFIG_FILE: configs/ipq60xx-nowifiV2.config
  DIY_SCRIPT: libwrt.sh
  CACHE_TOOLCHAIN: true
  UPLOAD_BIN_DIR: false
  FIRMWARE_RELEASE: true
  FIRMWARE_TAG: IPQ60XX-6.12-NOWIFIV2
  KEEP_RELEASES: 7                # 唯一保留策略（Delete-Old-Workflows 已同步为同一数值）
  TZ: Asia/Shanghai

jobs:
  Build:
    # ubuntu-22.04 自 2026-09-17 起进入弃用期，2027-04-17 完全不可用
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      # ============================================================
      # 1. 初始化编译环境
      # ============================================================
      - name: Initialization Environment(初始化环境)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker images -q | xargs -r docker rmi -f || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" || true

          sudo -E apt-get -y update
          # 依赖内联，不依赖任何外部短链（原 is.gd/depends_ubuntu_2204 已 404）
          # 清单同时兼容 22.04 / 24.04；使用 libncurses-dev 而非已移除的 libncurses5-dev
          sudo -E apt-get -y install --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git git-lfs libncurses-dev libssl-dev zlib1g-dev \
            python3 python3-dev python3-setuptools python3-pip rsync swig unzip zip \
            file wget curl bc kmod device-tree-compiler ccache cmake cpio gperf \
            help2man intltool libelf-dev libglib2.0-dev libgmp-dev libmpc-dev \
            libmpfr-dev libtool libreadline-dev p7zip-full patch pkgconf scons \
            squashfs-tools subversion texinfo uglifyjs upx-ucl xxd qemu-utils \
            ninja-build
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get -y clean
          sudo timedatectl set-timezone "$TZ"

      # ============================================================
      # 2. 合并磁盘空间
      # ============================================================
      # 注意：easimon/maximize-build-space 已 1 年多未更新（最后推送 2025-03-28），
      # 若其在 24.04 上出现 LVM 兼容性问题，可直接删除本步骤，
      # 依赖第 1 步中移除 dotnet/android 释放的空间（通常已足够）。
      - name: Combine Disks(合并磁盘)
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794 # v10 / master
        with:
          swap-size-mb: 1024
          temp-reserve-mb: 100
          root-reserve-mb: 1024

      # ============================================================
      # 3. 检出当前仓库
      # ============================================================
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ============================================================
      # 4. 克隆 OpenWrt 源码
      # ============================================================
      - name: Clone Source Code(克隆源代码)
        run: |
          df -hT "$GITHUB_WORKSPACE"
          git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
          VERSION_INFO=$(git show -s --date=short --format="作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %H")
          echo "VERSION_INFO=$VERSION_INFO" >> $GITHUB_ENV
          VERSION_KERNEL=$(grep -oP 'LINUX_KERNEL_HASH-\K[0-9]+\.[0-9]+\.[0-9]+' target/linux/generic/kernel-6.12 2>/dev/null || echo "6.12")
          echo "VERSION_KERNEL=$VERSION_KERNEL" >> $GITHUB_ENV
          echo "SOURCE_REPO=$(echo "$REPO_URL" | awk -F '/' '{print $(NF)}' | sed 's/\.git//')" >> $GITHUB_ENV

      # ============================================================
      # 5. 生成编译变量
      # ============================================================
      - name: Generate Variables(生成变量)
        run: |
          cd "$OPENWRT_PATH"
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          make defconfig > /dev/null 2>&1
          echo "DEVICE_TARGET=$(grep '^CONFIG_TARGET_BOARD' .config | awk -F '"' '{print $2}')" >> $GITHUB_ENV
          echo "DEVICE_SUBTARGET=$(grep '^CONFIG_TARGET_SUBTARGET' .config | awk -F '"' '{print $2}')" >> $GITHUB_ENV

      # ============================================================
      # 6. 缓存工具链
      # ============================================================
      - name: Cache Toolchain(缓存工具链)
        if: env.CACHE_TOOLCHAIN == 'true'
        uses: HiGarfield/cachewrtbuild@3c396d6d42253c392a1c7c2ca996869c3d5b5853 # main
        with:
          ccache: false
          mixkey: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
          prefix: ${{ env.OPENWRT_PATH }}

      # ============================================================
      # 7. 更新 Feeds
      # ============================================================
      - name: Update Feeds(更新feeds)
        run: |
          cd "$OPENWRT_PATH"
          ./scripts/feeds update -a
          # install -a 放到自定义脚本之后，避免双重安装

      # ============================================================
      # 8. 运行自定义脚本（负责添加插件、消除重复来源、报告版本）
      # ============================================================
      - name: Load Custom Configuration(加载自定义配置)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACK_LATEST: ${{ inputs.track_latest && '1' || '0' }}
        run: |
          [ -e files ] && mv files "$OPENWRT_PATH/files"
          chmod +x "$DIY_SCRIPT"
          cd "$OPENWRT_PATH"
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          "$GITHUB_WORKSPACE/$DIY_SCRIPT"

      # ============================================================
      # 9. 安装 Feeds 并检测重复包来源
      # ============================================================
      - name: Install Feeds And Detect Duplicates(安装feeds并检测重复包)
        run: |
          cd "$OPENWRT_PATH"
          ./scripts/feeds install -a
          make defconfig

          # 重复来源会导致"编的是哪一份"不可控（immortalwrt 的 sing-box 落后两个小版本）
          # 用 "*/<pkg>/Makefile" 而非 -name "$p" 找目录，避免把外层包装目录误报为重复源
          for p in xray-core sing-box luci-app-passwall xray-plugin chinadns-ng; do
            found=$(find package -type f -name Makefile -path "*/$p/Makefile" \
                    -not -path "*/build_dir/*" -not -path "*/.git/*" 2>/dev/null | sort)
            count=$(printf '%s' "$found" | grep -c . || true)
            echo "$p 来源($count)："; echo "$found"
            [ "$count" -le 1 ] || { echo "::error::存在重复包来源 $p，请在 libwrt.sh 中移除 feed 侧副本"; exit 1; }
          done

      # ============================================================
      # 10. 下载 DL 软件包
      # ============================================================
      - name: Download DL Package(下载DL软件包)
        run: |
          cd "$OPENWRT_PATH"
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -exec ls -l {} \; || true
          find dl -size -1024c -exec rm -f {} \; || true

      # ============================================================
      # 11. 编译固件（始终留存日志）
      # ============================================================
      - name: Compile Firmware(开始编译固件)
        id: compile
        run: |
          cd "$OPENWRT_PATH"
          echo "==================== 编译配置 ===================="
          grep "CONFIG_PACKAGE" .config | head -n 50
          echo "=================================================="

          # 先把当前 config 备份一份（失败诊断用）
          cp .config config-on-failure.txt
          set +e
          make -j"$(nproc)" 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::多线程编译失败(rc=$rc)，降级为单线程并输出详细日志"
            make -j1 V=s 2>&1 | tail -n 5000 | tee -a build.log
            rc=${PIPESTATUS[0]}
          fi
          set -e

          if [ "$rc" -ne 0 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

          # 关键校验：make 返回 0 ≠ 真的编出固件（缓存命中、被中断、pkg 静默失败都会骗过 $?）
          # 这里再做一次"产物存在性"断言，确保下游步骤拿到的是真固件
          BIN_DIR=$(ls -d bin/targets/*/*/ 2>/dev/null | head -1 || true)
          if [ -z "$BIN_DIR" ] || ! ls "$BIN_DIR"/*factory*.bin "$BIN_DIR"/*sysupgrade*.bin \
                                       "$BIN_DIR"/*squashfs*.bin "$BIN_DIR"/*.img.gz 2>/dev/null \
                                  | grep -q .; then
            echo "::error::make 返回 0 但 bin/targets/*/* 下没有找到任何固件镜像"
            echo "::error::这是典型的'假成功'，可能原因：缓存未失效、feeds 没装齐、单包编译失败被静默吞掉"
            echo "============ bin 目录实际清单 ============"
            find bin -type f 2>/dev/null | head -50 || echo "（bin 目录也不存在）"
            echo "========================================="
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "✅ 固件产物校验通过: $BIN_DIR"

          echo "status=success" >> $GITHUB_OUTPUT
          echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
          echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV
          echo "RELEASE_TAG=${FIRMWARE_TAG}-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_ENV

      # ============================================================
      # 12. 失败时上传诊断产物
      # ============================================================
      - name: Upload Build Log On Failure(失败时上传编译日志)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-${{ env.FILE_DATE || 'unknown' }}
          path: |
            ${{ env.OPENWRT_PATH }}/build.log
            ${{ env.OPENWRT_PATH }}/config-on-failure.txt
          retention-days: 7

      # ============================================================
      # 13. 检查磁盘使用
      # ============================================================
      - name: Check Space Usage(检查空间使用情况)
        if: (!cancelled())
        run: |
          df -hT
          du -sh "$OPENWRT_PATH/bin" 2>/dev/null || echo "bin 目录不存在"

      # ============================================================
      # 14. 上传 bin 目录（可选）
      # ============================================================
      - name: Upload Bin Directory(上传固件)
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.SOURCE_REPO }}-bin-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
          path: ${{ env.OPENWRT_PATH }}/bin
          retention-days: 7

      # ============================================================
      # 15. 整理固件文件（防御式 cd：找不到目标目录时打印诊断而不是糊脸报 No such file）
      # ============================================================
      - name: Organize Files(整理文件)
        if: steps.compile.outputs.status == 'success'
        run: |
          # 解析真实的 bin 目录（不用 glob 展开失败）
          BIN_DIR=$(ls -d "$OPENWRT_PATH"/bin/targets/*/*/ 2>/dev/null | head -1 || true)
          if [ -z "$BIN_DIR" ]; then
            echo "::error::找不到固件目录 bin/targets/<target>/<subtarget>/"
            echo "::error::通常意味着编译步骤因 make 静默失败而无产物。请查看 build.log"
            echo "============ bin 实际内容 ============"
            find "$OPENWRT_PATH/bin" -type f 2>/dev/null | head -50 || echo "(无)"
            echo "===================================="
            exit 1
          fi
          cd "$BIN_DIR"
          echo "📁 固件目录: $BIN_DIR"
          ls -la

          cat sha256sums 2>/dev/null || echo "无校验和文件"
          cp "$OPENWRT_PATH/.config" build.config
          tar -zcf Packages.tar.gz packages
          rm -rf packages feeds.buildinfo version.buildinfo
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

      # ============================================================
      # 16. 上传固件到 Artifact（未发布到 Release 时）
      # ============================================================
      - name: Upload Firmware To Artifact(将固件上传到Artifact)
        if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.SOURCE_REPO }}-firmware-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE_PATH }}
          retention-days: 7

      # ============================================================
      # 17. 由 manifest 动态生成 Release 说明（杜绝手写清单与产物不符）
      # ============================================================
      - name: Generate Release Notes(生成发布说明)
        if: steps.compile.outputs.status == 'success'
        run: |
          cd "${FIRMWARE_PATH:-$OPENWRT_PATH/bin/targets}"
          notes="$GITHUB_WORKSPACE/release-notes.md"
          {
            echo "**This is OpenWrt Firmware for ${FIRMWARE_TAG}**"
            echo
            echo "### 📒 固件信息(无WIFI)"
            echo "- 无WIFI带有线NSS的6.12内核固件"
            echo "- 💻 这是 ${FIRMWARE_TAG} 平台使用的 OpenWrt 固件"
            echo "- ⚽ 固件源码: ${REPO_URL}"
            echo "- 💝 源码分支: ${REPO_BRANCH}"
            echo "- 🌐 默认地址: 192.168.1.1"
            echo "- 🔑 默认密码: password"
            echo
            echo "### 🧊 固件版本"
            echo "- 固件内核版本：${VERSION_KERNEL}"
            echo "- Xray-core 版本：v${XRAY_VERSION}"
            echo "- Sing-box 版本：v${SINGBOX_VERSION}"
            echo "- Passwall 版本：${PASSWALL_VERSION}"
            echo
            echo "### 📦 实际集成组件（由 manifest 自动生成，非手写）"
            grep -Eh "^(luci-app-passwall|luci-app-passwall2|xray-core|xray-plugin|sing-box|chinadns-ng|v2ray-geoip|v2ray-geosite|geoview|hysteria|naiveproxy|shadowsocks-rust|shadow-tls|simple-obfs|dns2socks|ipt2socks|tcping|microsocks|luci-app-openclash|smartdns|mosdns) - " ./*.manifest \
              | sort -u | sed -E 's/^([a-z0-9._+-]+) - ([0-9A-Za-z._~+-]+)$/- \1  \2/' || true
            echo
            echo "### 🔄 更新说明"
            echo "- 固件编译前最后一次➦[主源码](${REPO_URL})更新记录"
            echo "- ${VERSION_INFO}"
            echo
            echo "### ⚠️ 注意事项"
            echo "- 本固件为无WiFi版本，适合作为有线路由/旁路网关使用"
            echo "- 默认管理IP: 192.168.1.1"
            echo "- 默认密码: password"
            echo "- 首次刷机请使用 factory.ubi 文件"
            echo "- 系统升级请使用 sysupgrade.bin 文件"
          } > "$notes"
          cat "$notes"

      # ============================================================
      # 18. 发布固件到 GitHub Release
      # ============================================================
      - name: Upload Firmware To Release(发布固件)
        if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          name: R${{ env.DATE }} for ${{ env.FIRMWARE_TAG }}
          tag: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ env.FIRMWARE_PATH }}/*
          body-path: release-notes.md

      # ============================================================
      # 19. 清理旧 Release（唯一保留策略，与 Delete-Old-Workflows 保持一致）
      # ============================================================
      - name: Delete Old Releases(删除旧的发布)
        if: steps.compile.outputs.status == 'success' && env.FIRMWARE_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t tags < <(gh release list --limit 200 --json tagName \
            --jq '.[] | .tagName' | grep "^${FIRMWARE_TAG}-" || true)
          echo "当前 ${FIRMWARE_TAG}-* 共 ${#tags[@]} 个"
          if [ "${#tags[@]}" -gt "$KEEP_RELEASES" ]; then
            for tag in "${tags[@]:$KEEP_RELEASES}"; do
              echo "删除旧 Release: $tag"
              gh release delete "$tag" -y --cleanup-tag || echo "::warning::删除 $tag 失败"
            done
          fi

      # ============================================================
      # 20. 编译失败通知
      # ============================================================
      - name: Notification On Failure(编译失败通知)
        if: failure()
        run: |
          echo "❌ 编译失败"
          echo "时间: $(date)"
          echo "分支: $REPO_BRANCH"
          echo "Xray: ${XRAY_VERSION:-unknown} / Sing-box: ${SINGBOX_VERSION:-unknown}"
          echo "日志与失败时的 .config 已上传为 Artifact: build-log-*"
